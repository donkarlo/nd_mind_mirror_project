# Dedicated Mind Mirror keyboard shortcuts; edit in Settings > Keyboard Shortcuts and press Apply.
shortcuts:
  file.new_latex:
    label: New unsaved LaTeX document
    keys: Ctrl+Shift+N
  file.open:
    label: Open file
    keys: Ctrl+O
  file.save:
    label: Save current file
    keys: Ctrl+S
  tab.close:
    label: Close current tab
    keys: Ctrl+W
  latex.format:
    label: Format LaTeX
    keys: Ctrl+Shift+F
  find.current:
    label: Find in Source, Visual, or live PDF Preview
    keys: Ctrl+F
  preview.find:
    label: Find text in a pinned PDF Preview (previous/next matches)
    keys: Ctrl+F
  preview.copy:
    label: Copy selected text or word from a PDF Preview (including pinned)
    keys: Ctrl+C
  replace.current:
    label: Replace in current tab
    keys: Ctrl+R
  preview.toggle:
    label: Show or hide preview
    keys: Ctrl+Alt+P
  editor.bold:
    label: Bold selection
    keys: Ctrl+B
  editor.reset_zoom:
    label: Reset editor zoom
    keys: Ctrl+0
  find.close:
    label: Close find/replace bar
    keys: Escape
  navigator.delete:
    label: Delete selected navigator item
    keys: Delete
