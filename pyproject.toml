[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nd_mind_mirror_project"
version = "0.31.10"
description = "Ubuntu Qt writing environment with LaTeX Source/Visual editing, live PDF preview, Persian RTL, synchronized preview highlighting, and a native Swift Playgrounds Apple Pencil graphic companion for iPad."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8",
    "PyYAML>=6.0",
    "Pygments>=2.17",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "watchfiles>=1.1,<2"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"nd_mind_mirror.ui.preview.pdf" = ["*.qml"]
"nd_mind_mirror.graphic.web" = ["*.html", "*.css", "*.js", "*.webmanifest"]
"nd_mind_mirror.core.settings.defaults" = ["*.yaml", "templates/*.tex"]
