[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nd_mind_mirror_project"
version = "0.20.0"
description = "Qt LaTeX/YAML editor with bidirectional editing, citation-aware live preview, cursor-centered zoom, automatic width fit, hierarchical file search, in-editor find/replace, structure navigation, and persistent UI state."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8",
    "PyYAML>=6.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"nd_mind_mirror.ui.preview.pdf" = ["*.qml"]
